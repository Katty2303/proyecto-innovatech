version: "3.8"

# Red interna aislada para que los microservicios se comuniquen de forma segura
networks:
  red-innovatech:
    driver: bridge

services:
  # --------------------------------------------------------
  # 1. CONTENEDOR FRONTEND
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Expone el puerto 3000 al mundo exterior (AWS)
    networks:
      - red-innovatech
    restart: always

  # --------------------------------------------------------
  # 2. CONTENEDOR BACKEND - VENTAS
  # --------------------------------------------------------
  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    ports:
      - "8081:8081" # Expone el puerto de Ventas
    networks:
      - red-innovatech
    restart: always

  # --------------------------------------------------------
  # 3. CONTENEDOR BACKEND - DESPACHOS
  # --------------------------------------------------------
  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    ports:
      - "8082:8082" # Expone el puerto de Despachos
    networks:
      - red-innovatech
    restart: always

  # --------------------------------------------------------
  # 4. CONTENEDOR BASE DE DATOS (Ejemplo con PostgreSQL)
  # --------------------------------------------------------
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user_innovatech
      POSTGRES_PASSWORD: password_seguro_123
      POSTGRES_DB: innovatech_db
    ports:
      - "5432:5432"
    networks:
      - red-innovatech
    restart: always
