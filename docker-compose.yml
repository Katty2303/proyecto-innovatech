version: "3.8"

# Red interna y Volúmenes nombrados para persistencia (Requerimiento IE3)
networks:
  red-innovatech:
    driver: bridge

volumes:
  postgres_data:
    driver: local # Named volume para asegurar que los datos sobrevivan a reinicios

services:
  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    networks:
      - red-innovatech
    restart: always

  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    networks:
      - red-innovatech
    restart: always

  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    networks:
      - red-innovatech
    restart: always

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user_innovatech
      POSTGRES_PASSWORD: password_seguro_123
      POSTGRES_DB: innovatech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Asocia los archivos internos de Postgres al volumen local
    networks:
      - red-innovatech
    restart: always
